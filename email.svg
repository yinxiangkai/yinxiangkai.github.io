<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
  <!-- 信封线条以「镂空」方式从圆盘中挖出（透明而非白色），
       这样深色模式的 brightness-0 + invert 滤镜不会把线条和圆盘一起刷成白色。 -->
  <defs>
    <mask id="email-knockout">
      <rect width="24" height="24" fill="#fff" />
      <g fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="8" width="12" height="8" rx="1.2" />
        <path d="m6.8 9 5.2 3.8L17.2 9" />
      </g>
    </mask>
  </defs>
  <circle cx="12" cy="12" r="10" fill="#0078d4" mask="url(#email-knockout)" />
</svg>
